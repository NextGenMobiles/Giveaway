<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giveaway</title>
  <style>

    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    
    .header {
      padding: 20px;
      background-color: black;
      text-align: center;
      color: white;
    }

    .header h2 {
      font-size: 22px;
      margin: 0;
    }

    
    .image {
      text-align: center;
      margin: 20px 0;
    }

    .image img {
      width: 90%;
      max-width: 400px; 
      height: auto;
      border-radius: 10px;
      display: block;
      margin: 0 auto;
    }

    @media (max-width: 480px) {
      .header {
        padding: 15px;
      }

      .header h2 {
        font-size: 18px;
      }

      .image img {
        width: 95%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Nokki Irunna Mathi Eppo Theram</h2>
  </div>

  <div class="image">
    <img src="gorilla.jpg" alt="Gorilla">
  </div>
</body>
</html>
